name: CI Build

on:
  push:
    # Integration / Deployment runs ONLY when code lands on the main branch.
    branches: [ "master" ]
  pull_request:
    # Validation runs when a PR is created, checks code quality and tests.
    branches: [ "master", "development" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      # Git Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # Docker Credentials
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_KEY }}

    # Set up environment file for Docker Compose
    - name: Set up environment
      run: |
        cp docker/environments/dev.env.example docker/environments/dev.env
        mkdir -p src/storage/logs src/storage/framework/{cache,sessions,views} src/bootstrap/cache
        sudo chown -R 1000:1000 src/storage src/bootstrap/cache

    # Building Docker Images
    - name: Build Docker Images
      run: make build

    # Start Containers
    - name: Start Docker Containers
      run: make up

    # Install Dependencies
    - name: Install Composer Dependencies
      run: make composer cmd="install --no-interaction"

    # Smoke test — verify Laravel is running
    - name: Smoke Test
      run: make artisan cmd="--version"

    # Teardown routine, clean after yourself!
    - name: Teardown
      if: always()
      run: make down-v

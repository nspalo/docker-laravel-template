;
; Custom PHP Settings for Development

; =========================================================
; 1. RESOURCE MANAGEMENT
; =========================================================

; Maximum amount of memory a script may consume
memory_limit = 512M

; Maximum execution time of each script, in seconds
max_execution_time = 0


; =========================================================
; 2. ERROR & LOGGING
; =========================================================

error_reporting = E_ALL
display_errors = On      ; Show errors directly on the screen (Dev only)
log_errors = On          ; Log errors to stderr (captured by Docker)
error_log = /proc/self/fd/2


; =========================================================
; 3. UPLOADS & FILES
; =========================================================

post_max_size = 16M
upload_max_filesize = 16M
max_file_uploads = 20


; =========================================================
; 4. SECURITY & SESSIONS
; =========================================================

session.cookie_secure = 0    ; Dev only — MUST be 1 in production
session.use_strict_mode = 1
session.use_only_cookies = 1


; =========================================================
; 5. OPCACHE (PERFORMANCE)
; =========================================================

opcache.enable = 0     ; Disabled in development for code changes to reflect immediately
opcache.enable_cli = 0

# ===========================================================================
# PRODUCTION OVERRIDE
# ---------------------------------------------------------------------------
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# This override:
#   - Exposes ONLY the web port (no PHP/MySQL ports on host)
#   - No volume mounts (code is baked into the image)
#   - Restart policies on all services
#   - Resource limits to prevent runaway containers
#   - Health checks for reliability
#   - Read-only filesystems where possible
#   - Security options (no new privileges)
# ===========================================================================

services:
  webserver:
    ports:
      - "${APP_PORT}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  php:
    build:
      context: ..
      dockerfile: docker/containers/php/Dockerfile
      target: production
      args:
        PHP_VERSION: "${PHP_VERSION}"
        SYS_ENV: "${SYS_ENV}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.00"
    # No ports exposed — only accessible via nginx on the internal network
    # No volume mounts — code is baked into the image via Dockerfile

  database:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    # No ports exposed — only accessible from PHP on the internal network
